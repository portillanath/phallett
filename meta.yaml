package:
  name: phallett
  version: "0.1.0"

source:
  git_url: https://github.com/portillanath/phallett.git
  git_tag: main  # or a version tag if available

build:
  noarch: python
  script: python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python =3.12
    - pip
  run:
    - python =3.12
    - biopython =1.83
    - bitstring =3.1.9
    - fastani =1.34
    - mash =2.3
    - numpy =1.26.4
    - pandas =2.2.2
    - scipy =1.13.0
    - screed =1.1.3
    - seaborn =0.13.2
    - matplotlib-base =3.8.4
    - openpyxl =3.1.2
    - statsmodels =0.14.1
    - sourmash =4.8.8
    - skani =0.2.1
    - patsy =0.5.6
    - packaging =24.0

test:
  imports:
    - phallett  # replace this with actual importable module(s)
  commands:
    - phallett --help  # if there's a CLI

about:
  home: https://github.com/portillanath/phallett
  license: MIT  # adjust if different
  summary: "A program for genomic distances calculation and graphing."
